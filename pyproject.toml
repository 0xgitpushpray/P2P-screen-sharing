[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p2pshare"
version = "0.1.0"
description = "Lightweight peer-to-peer screen sharing with Python, WebRTC and WebSockets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiortc>=1.9",
    "websockets>=14",
    "mss>=9",
    "numpy",
    "opencv-python",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
p2pshare = "p2pshare.cli:main"

[tool.setuptools]
packages = ["p2pshare"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
